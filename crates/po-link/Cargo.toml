[package]
name = "po-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# A fake GitHub (device flow, gists with ETags), for the tests of the crates that use this one.
fake = []
# Sockets on the loopback only, for the tests of the crates that use this one (see
# `net::LOOPBACK_ONLY`). Enabled from dev-dependencies, so never in a real build.
loopback = []

[dependencies]
po-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
base64.workspace = true
reqwest.workspace = true
async-trait.workspace = true
futures-util.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
socket2 = "0.6"
mdns-sd = "0.22"

# Asking the router to open a port: only where Po's service runs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
igd-next = { version = "0.18", features = ["aio_tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true

[[example]]
name = "fake_github"
required-features = ["fake"]
