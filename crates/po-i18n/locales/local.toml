# Model catalog

[local.catalog.unreadable_from_distro]
fr = "{path} : illisible depuis la distribution {distro}"
en = "{path}: unreadable from the {distro} distribution"

# Launch plan: compromises and summary

[local.plan.context_reduced]
fr = "contexte ramené de {asked} à {granted} tokens, faute de mémoire"
en = "context reduced from {asked} to {granted} tokens for lack of memory"

[local.plan.cache_quantized]
fr = "cache KV quantifié en 8 bits pour tenir en mémoire"
en = "KV cache quantized to 8 bits to fit in memory"

[local.plan.partial_offload]
fr = "{on_gpu} couches sur {total} seulement sur le GPU — débit réduit"
en = "only {on_gpu} of {total} layers on the GPU — reduced throughput"

[local.plan.cpu_only]
fr = "aucune couche sur le GPU — inférence CPU, lente"
en = "no layer on the GPU — slow CPU inference"

[local.plan.context_capped]
fr = "contexte plafonné à {trained} tokens, limite d'entraînement du modèle"
en = "context capped at {trained} tokens, the model's training limit"

[local.plan.memory_unmeasured]
fr = "mémoire non mesurée sur ce système — plan non vérifié"
en = "memory not measured on this system — plan unverified"

[local.plan.no_viable_config]
fr = "aucune configuration tenable sur cette machine"
en = "no sustainable configuration on this machine"

[local.plan.summary_vram]
fr = " · {mib} Mio"
en = " · {mib} MiB"

# Server supervisor

