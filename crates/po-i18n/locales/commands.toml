# Interface texts (commands). Every key has a French and an English version.

# Help: unindented sections, then "/command args   description" (at least two spaces
# before the description). `help()` and completion parse it: keep this format.
[cmd.help.text]
fr = """
Session
  /labs [on|off]          Po Labs : façonnez Po en en parlant (désactivé par défaut)
  /langue <fr|en>         langue de l'interface, changée tout de suite
  /parametres             tous les réglages, même pendant un tour (F2, Ctrl+K)
  /plan                   mode plan : lecture seule, le modèle propose un plan (Maj+Tab)
  /builder                mode builder : les actions sensibles demandent votre accord
  /bypass                 mode bypass : tout est autorisé sans demander
  /reprendre [n|titre]                      reprend une autre conversation de ce projet
  /raccourci [labs|pause] <touches>         change un raccourci (1 à 4 touches)
  /statusline [demande|defaut]              personnalise la barre sous la saisie
  /verbosite [discret|normal|detaille]      ce que montre le travail d'un tour
  /reflexion [none|low|medium|high|defaut]  niveau de réflexion du modèle local
  /reflexion budget [n|auto|off]            tokens de réflexion par réponse
  /temperature [valeur|defaut]              température imposée
  /raisonnement [on|off]                     affiche ou masque le raisonnement du modèle
  /contexte                                  place occupée dans la fenêtre de contexte
  /cache                                     cache du serveur et vitesse du dernier appel
  /nouveau                                   repart d'une conversation vide
  /compacter                                 résume l'historique pour alléger les requêtes
  /instructions                              fichiers AGENTS.md / CLAUDE.md / PO.md lus
  /criteres [ajouter <texte>|retirer <n>|vider]  critères vérifiés en fin de tour
Modèles
  /modeles                liste les modèles et leur marge
  /mode [nom]             change le mode de budget (sans nom : mode suivant)
  /modele <id|auto>       impose un modèle, ou rend la main au routeur
  /local [n|stop|etat]    modèles GGUF de la machine, démarrage, arrêt
  /local decharge <n>     décharge un modèle sans arrêter le serveur
  /local dossier <chemin> ajoute un dossier de modèles GGUF (retenu pour les sessions suivantes)
  /local serveur <chemin> choisit le binaire llama-server
  /serveur [decharger|charger]  état du serveur local (Strata : VRAM, débit, MTP)
Sous-agents
  /agents                 sous-agents, modèle de chacun, parallélisme
  /agents voir <nom>      règles et emplacement d'un sous-agent
  /agents creer [projet|global] <description>  le modèle de la session rédige un sous-agent
  /agents modele <nom> <id|session|auto>       modèle d'un sous-agent (retenu)
  /agents parallele <n|auto>  sessions simultanées sur le serveur de la session (retenu)
  /agents retirer <nom>   supprime un sous-agent personnalisé
  /agents recharger       relit .po/agents et les sous-agents permanents
  /delegation [on|off]    autorise ou non les sous-agents
Outils
  /outils                 outils visibles par le modèle
  /mcp                    serveurs MCP branchés et disponibles
  /mcp activer <nom>      lance un serveur déclaré dans .mcp.json
  /mcp ajouter <nom> <commande|url> [args…]   branche un serveur (stdio, ou HTTP par son adresse)
  /mcp garder <nom>       l'enregistre dans .mcp.json pour les prochaines sessions
  /mcp retirer <nom>      le débranche
  /skills [recharger]     compétences disponibles (.po/skills, .claude/skills)
Dictée vocale (whisper.cpp, désactivée par défaut)
  /voix                   état de la dictée
  /voix on|off            active ou coupe la dictée (bouton « dicter » sous la saisie, F3)
  /voix installer         télécharge whisper.cpp et le modèle retenus
  /voix moteur <cpu|gpu [n]>   processeur, ou carte graphique (la plus libre par défaut)
  /voix modele <small|base|turbo>  modèle de transcription
  /voix micros            micros disponibles ; /voix micro <nom|auto> pour en choisir un
  /voix langue <fr|en|auto>  langue parlée
  /voix tester <fichier.wav>   transcrit un fichier
Divers
  !commande               exécute une commande ; sa sortie est jointe à la demande suivante
  @chemin                 joint un fichier (ou une image) à la demande
  /controle               adresse MCP pour piloter cette session de l'extérieur
  /redemarrer             relance Po (binaire installé) sur la même session
  /cout                   dépense de la session
  /quitter                termine la session
Saisie : Alt+Entrée, Maj+Entrée ou Ctrl+J pour aller à la ligne."""
en = """
Session
  /labs [on|off]          Po Labs: shape Po by talking to it (off by default)
  /language <fr|en>       interface language, changed right away
  /settings               all settings, even during a turn (F2, Ctrl+K)
  /plan                   plan mode: read-only, the model proposes a plan (Shift+Tab)
  /builder                builder mode: sensitive actions ask for your approval
  /bypass                 bypass mode: everything is allowed without asking
  /resume [n|title]                       resume another conversation of this project
  /shortcut [labs|pause] <keys>           change a shortcut (1 to 4 keys)
  /statusline [request|default]           customize the line under the input
  /verbosity [quiet|normal|verbose]       how much of a turn's work is shown
  /effort [none|low|medium|high|default]  reasoning level of the local model
  /effort budget [n|auto|off]             thinking tokens per reply
  /temperature [value|default]            forced temperature
  /thinking [on|off]                      show or hide the model's reasoning
  /context                                space used in the context window
  /cache                                  server cache and speed of the last call
  /new                                    start over with an empty conversation
  /compact                                summarize the history to lighten requests
  /instructions                           AGENTS.md / CLAUDE.md / PO.md files read
  /criteria [add <text>|remove <n>|clear]  criteria checked at the end of a turn
Models
  /models                 list the models and their headroom
  /mode [name]            change the budget mode (no name: next mode)
  /model <id|auto>        pin a model, or hand control back to the router
  /local [n|stop|status]  GGUF models on this machine, start, stop
  /local unload <n>       unload a model without stopping the server
  /local dir <path>       add a folder of GGUF models (remembered for later sessions)
  /local server <path>    choose the llama-server binary
  /server [unload|load]   local server status (Strata: VRAM, speed, MTP)
Subagents
  /agents                 subagents, each one's model, parallelism
  /agents show <name>     rules and location of a subagent
  /agents create [project|global] <description>  the session model writes a subagent
  /agents model <name> <id|session|auto>         model of a subagent (remembered)
  /agents parallel <n|auto>  simultaneous sessions on the session's server (remembered)
  /agents remove <name>   delete a custom subagent
  /agents reload          re-read .po/agents and the permanent subagents
  /delegation [on|off]    allow or forbid subagents
Tools
  /tools                  tools visible to the model
  /mcp                    MCP servers connected and available
  /mcp enable <name>      start a server declared in .mcp.json
  /mcp add <name> <command|url> [args…]   connect a server (stdio, or HTTP by its address)
  /mcp keep <name>        save it to .mcp.json for future sessions
  /mcp remove <name>      disconnect it
  /skills [reload]        available skills (.po/skills, .claude/skills)
Voice dictation (whisper.cpp, off by default)
  /voice                  dictation status
  /voice on|off           turn dictation on or off (\"dictate\" button under the input, F3)
  /voice install          download whisper.cpp and the chosen model
  /voice engine <cpu|gpu [n]>  processor, or graphics card (the freest one by default)
  /voice model <small|base|turbo>  transcription model
  /voice mics             available microphones; /voice mic <name|auto> to pick one
  /voice language <fr|en|auto>  spoken language
  /voice test <file.wav>  transcribe a file
Misc
  !command                run a command; its output is attached to the next request
  @path                   attach a file (or an image) to the request
  /control                MCP address to drive this session from outside
  /restart                relaunch Po (installed binary) on the same session
  /cost                   spending of the session
  /quit                   end the session
Input: Alt+Enter, Shift+Enter or Ctrl+J for a new line."""

