# Remote control from the phone: `/rc`, the background service, sessions without a terminal.

[rc.title]
fr = "Contrôle à distance"
en = "Remote control"

[rc.account]
fr = "Compte GitHub"
en = "GitHub account"

[rc.not_connected]
fr = "non connecté"
en = "not connected"

[rc.connect_hint]
fr = "/rc connecter, puis connectez-vous avec le même compte dans l'app Po du téléphone : c'est l'appairage."
en = "/rc login, then sign in with the same account in the Po app on your phone: that is the pairing."

[rc.needs_gist]
fr = "Cette connexion ne donne pas accès aux gists, dont le contrôle à distance a besoin : /rc changer pour la refaire."
en = "This connection has no access to gists, which remote control needs: /rc switch to make it again."

[rc.account_error]
fr = "inaccessible ({error})"
en = "unreachable ({error})"

[rc.github_slow]
fr = "GitHub ne répond pas"
en = "GitHub does not answer"

[rc.name]
fr = "Nom du PC"
en = "PC name"

[rc.name_hint]
fr = "/rc nom <nom> pour le changer : c'est ce que le téléphone affiche."
en = "/rc name <name> to change it: it is what the phone shows."

[rc.renamed]
fr = "Ce PC s'appelle maintenant « {name} »."
en = "This PC is now called “{name}”."

[rc.already]
fr = "Déjà connecté à GitHub en tant que {login}."
en = "Already connected to GitHub as {login}."

[rc.switch_hint]
fr = "/rc changer pour utiliser un autre compte."
en = "/rc switch to use another account."

[rc.switch.other_account]
fr = "Sur la page GitHub, connectez-vous d'abord au compte voulu, puis entrez le code."
en = "On the GitHub page, sign in to the account you want first, then enter the code."

[rc.login.title]
fr = "Connexion à GitHub"
en = "Connecting to GitHub"

[rc.login.page]
fr = "Page"
en = "Page"

[rc.login.code]
fr = "Code"
en = "Code"

[rc.login.then]
fr = "La connexion est retenue pour toutes les sessions ; le service la prend dès qu'elle est faite."
en = "The connection is remembered for every session; the service takes it as soon as it is made."

[rc.logged_out]
fr = "Déconnecté de GitHub : les téléphones ne joignent plus ce PC."
en = "Disconnected from GitHub: phones no longer reach this PC."

[rc.logged_out_hint]
fr = "Le partage des contributions de Po Labs demandera aussi une nouvelle connexion."
en = "Sharing Po Labs contributions will ask for a new connection too."

[rc.devices]
fr = "Appareils du compte"
en = "Devices of the account"

[rc.no_devices]
fr = "Aucun autre appareil : connectez-vous dans l'app Po du téléphone avec le même compte."
en = "No other device: sign in in the Po app on your phone with the same account."

[rc.device_detail]
fr = "{id} · vu {ago}"
en = "{id} · seen {ago}"

[rc.devices_need_service]
fr = "Le service n'est pas lancé : /rc demarrer."
en = "The service is not running: /rc start."

[rc.revoke_hint]
fr = "/rc revoquer <nom ou identifiant> :"
en = "/rc revoke <name or id>:"

[rc.revoked]
fr = "« {name} » est révoqué : il est refusé, et ne lit plus les adresses de vos appareils."
en = "“{name}” is revoked: it is refused, and no longer reads your devices' addresses."

[rc.no_such_device]
fr = "Aucun appareil « {which} »."
en = "No device “{which}”."

[rc.ambiguous]
fr = "Plusieurs appareils s'appellent « {which} » : donnez son identifiant."
en = "Several devices are called “{which}”: give its id."

[rc.at_logon_removed]
fr = "Le service ne démarrera plus à l'ouverture de session."
en = "The service will no longer start at logon."

[rc.unknown]
fr = "/rc {arg} : inconnu. /rc pour le menu."
en = "/rc {arg}: unknown. /rc for the menu."

