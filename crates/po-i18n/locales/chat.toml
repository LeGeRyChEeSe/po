[chat.help.text]
fr = '''
po {version} — harnais d'agent multi-modèles

USAGE:
    po [chat] [--mode <budget>] [--yes] [-p <requête>] [--continue]
    po local [chemin/vers/modele.gguf]
    po sessions [rm:<id>]
    po doctor [--render <profil>] [--demo]

COMMANDES:
    chat              conduit une session d'agent (par défaut)
    local             inventorie le matériel et calcule un plan de lancement
    sessions          liste les sessions enregistrées
    doctor            affiche les capacités détectées du terminal

OPTIONS:
    --mode <m>        budget : max-quality, balanced, save-max-tokens, offline
    -p, --prompt <t>  exécute une seule requête puis sort (utilisable dans un tube)
    -c, --continue    reprend la dernière session de ce répertoire
    --resume <id>     reprend une session précise (voir `po sessions`)
    -y, --yes         autorise les outils sans demander — à réserver aux scripts
    --render <p>      force le profil de rendu : rich, plain ou stream
    --demo            prend réellement le terminal quelques secondes pour vérifier
                      l'entrée et la sortie d'écran alterné
    --tty             analyse le terminal attaché même si la sortie est redirigée
                      (pour les scripts de diagnostic)
    -h, --help        affiche cette aide
    -V, --version     affiche la version

VARIABLES D'ENVIRONNEMENT:
    PO_RENDER         équivalent de --render
    PO_COLOR          force la profondeur : 0, 16, 256, truecolor
    PO_UNICODE        force le niveau : ascii, bmp, full
    PO_NO_PROBE       désactive l'interrogation du terminal
    NO_COLOR          désactive toute couleur'''
en = '''
po {version} — multi-model agent harness

USAGE:
    po [chat] [--mode <budget>] [--yes] [-p <prompt>] [--continue]
    po local [path/to/model.gguf]
    po sessions [rm:<id>]
    po doctor [--render <profile>] [--demo]

COMMANDS:
    chat              run an agent session (default)
    local             inventory the hardware and compute a launch plan
    sessions          list saved sessions
    doctor            show the detected terminal capabilities

OPTIONS:
    --mode <m>        budget: max-quality, balanced, save-max-tokens, offline
    -p, --prompt <t>  run a single request then exit (usable in a pipe)
    -c, --continue    resume the last session of this folder
    --resume <id>     resume a specific session (see `po sessions`)
    -y, --yes         allow tools without asking — for scripts only
    --render <p>      force the render profile: rich, plain or stream
    --demo            actually take over the terminal for a few seconds to check
                      entering and leaving the alternate screen
    --tty             analyse the attached terminal even if the output is redirected
                      (for diagnostic scripts)
    -h, --help        show this help
    -V, --version     show the version

ENVIRONMENT VARIABLES:
    PO_RENDER         same as --render
    PO_COLOR          force the depth: 0, 16, 256, truecolor
    PO_UNICODE        force the level: ascii, bmp, full
    PO_NO_PROBE       disable terminal probing
    NO_COLOR          disable all color'''
