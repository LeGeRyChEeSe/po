[engines.install.llama.title]
fr = "Obtenir llama.cpp"
en = "Getting llama.cpp"

[engines.install.llama.where]
fr = "llama.cpp est gratuit et libre. Ses versions prêtes à l'emploi sont sur https://github.com/ggml-org/llama.cpp/releases"
en = "llama.cpp is free and open source. Ready-to-use builds are on https://github.com/ggml-org/llama.cpp/releases"

[engines.install.llama.win_cuda]
fr = "Carte NVIDIA : prenez l'archive « llama-…-bin-win-cuda-…-x64.zip » et aussi « cudart-llama-bin-win-cuda-…-x64.zip », décompressez-les dans le même dossier. Ou en une commande : winget install llama.cpp"
en = "NVIDIA card: take the “llama-…-bin-win-cuda-…-x64.zip” archive and also “cudart-llama-bin-win-cuda-…-x64.zip”, unzip both into the same folder. Or in one command: winget install llama.cpp"

[engines.install.llama.win_vulkan]
fr = "Carte AMD ou Intel : prenez l'archive « llama-…-bin-win-vulkan-x64.zip » et décompressez-la. Ou en une commande : winget install llama.cpp"
en = "AMD or Intel card: take the “llama-…-bin-win-vulkan-x64.zip” archive and unzip it. Or in one command: winget install llama.cpp"

[engines.install.llama.win_cpu]
fr = "Sans carte graphique : prenez l'archive « llama-…-bin-win-cpu-x64.zip » et décompressez-la. Ou en une commande : winget install llama.cpp"
en = "Without a graphics card: take the “llama-…-bin-win-cpu-x64.zip” archive and unzip it. Or in one command: winget install llama.cpp"

[engines.install.llama.mac]
fr = "Sur Mac : brew install llama.cpp (ou l'archive « llama-…-bin-macos-arm64.zip »)."
en = "On a Mac: brew install llama.cpp (or the “llama-…-bin-macos-arm64.zip” archive)."

[engines.install.llama.linux]
fr = "Sous Linux : l'archive « llama-…-bin-ubuntu-x64.zip » (ou -vulkan-), brew install llama.cpp, ou une compilation depuis les sources pour CUDA."
en = "On Linux: the “llama-…-bin-ubuntu-x64.zip” archive (or -vulkan-), brew install llama.cpp, or a build from source for CUDA."

[engines.install.llama.then]
fr = "Ensuite : « Détecter à nouveau ». Si Po ne le trouve pas, « Chercher dans un autre dossier » avec le dossier décompressé."
en = "Then: “Detect again”. If Po does not find it, “Search another folder” with the unzipped folder."

[engines.install.strata.title]
fr = "Strata"
en = "Strata"

[engines.install.strata.private]
fr = "Strata est un moteur privé : Po ne l'installe pas et ne le télécharge pas. S'il est sur cette machine, Po le reprend tel quel."
en = "Strata is a private engine: Po does not install or download it. If it is on this machine, Po takes it as it is."

[engines.install.strata.then]
fr = "Si Po ne le trouve pas : « Chercher dans un autre dossier » avec le dossier de Strata (celui qui contient serve et les fichiers strata-*.json)."
en = "If Po does not find it: “Search another folder” with Strata's folder (the one holding serve and the strata-*.json files)."

