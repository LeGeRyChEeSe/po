# The engines (/moteurs, /engines): the local model servers, for beginners.

[engines.title]
fr = "Moteurs — les serveurs de modèles locaux"
en = "Engines — the local model servers"

[engines.how]
fr = "{cmd} ouvre le menu : démarrer un modèle, changer de dossier, indiquer un exécutable, ajouter un dossier de modèles."
en = "{cmd} opens the menu: start a model, change folder, set an executable, add a models folder."

[engines.usage]
fr = "Usage : {cmd} [strata|llama] [demarrer <n>|arreter|dossier <chemin>|executable <chemin>|modeles <chemin>|retirer <n>|auto|conseils|installer|detecter]"
en = "Usage: {cmd} [strata|llama] [start <n>|stop|folder <path>|executable <path>|models <path>|remove <n>|auto|advice|install|detect]"

[engines.unknown_action]
fr = "« {action} » n'est pas une action de ce moteur. Tapez {cmd} pour voir les choix."
en = "“{action}” is not an action of this engine. Type {cmd} to see the choices."

