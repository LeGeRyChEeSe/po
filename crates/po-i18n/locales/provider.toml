# Interface texts (provider). Every key has a French and an English version.

[provider.error.transport]
fr = "transport : {detail}"
en = "transport: {detail}"

[provider.error.unauthorized]
fr = "authentification refusée par {provider} — vérifier la clé d'API"
en = "authentication refused by {provider} — check the API key"

[provider.error.rate_limited]
fr = "quota ou cadence dépassée chez {provider}{hint}"
en = "quota or rate limit exceeded at {provider}{hint}"

[provider.error.retry_hint]
fr = " — réessayer dans {seconds} s"
en = " — retry in {seconds} s"

[provider.error.unknown_model]
fr = "le modèle {model} est inconnu de {provider}"
en = "model {model} is unknown to {provider}"

[provider.error.unknown_model_name]
fr = "inconnu"
en = "unknown"

[provider.error.context_overflow]
fr = "contexte dépassé : {tokens} tokens demandés pour une fenêtre de {window}"
en = "context exceeded: {tokens} tokens requested for a window of {window}"

[provider.error.malformed]
fr = "réponse illisible de {provider} : {detail}"
en = "unreadable response from {provider}: {detail}"

[provider.error.http]
fr = "{provider} a répondu {status} : {body}"
en = "{provider} answered {status}: {body}"

[provider.error.no_choice]
fr = "aucun choix dans la réponse"
en = "no choice in the response"
