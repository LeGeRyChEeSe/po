name: Release

# Pushing a tag `vX.Y.Z` builds Po for every platform and the Android app, then opens a draft
# GitHub release with the archives and their SHA-256 sums. The draft is reviewed and published by
# hand. The phone app downloads from the latest release, so publishing it is what ships the APK.
#
# The APK is signed with the release key when these repository secrets exist, else with a
# throwaway debug key (an APK signed that way cannot update one signed differently):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Marks the binaries as release builds: only those update themselves (crates/po/src/update.rs).
  PO_RELEASE: "1"

jobs:
  version:
    name: The tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$cargo_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but Cargo.toml says $cargo_version"; exit 1
          fi

  desktop:
    name: po (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p po --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="po-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          # The archive for people, the bare binary for `po update`.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/po.exe" "$name/"
            cp "target/${{ matrix.target }}/release/po.exe" "dist/po-${{ matrix.target }}.exe"
            7z a "dist/$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/po" "$name/"
            cp "target/${{ matrix.target }}/release/po" "dist/po-${{ matrix.target }}"
            tar -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  android-cli:
    name: po (aarch64-linux-android)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      # Bionic, not musl (refused by Android's seccomp filter), with both hash tables.
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$BIN:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-Wl,--hash-style=both"
          cargo build --release --locked -p po --target aarch64-linux-android
      - name: Package
        run: |
          name="po-${GITHUB_REF_NAME}-aarch64-linux-android"
          mkdir -p dist "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE target/aarch64-linux-android/release/po "$name/"
          cp target/aarch64-linux-android/release/po dist/po-aarch64-linux-android
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-aarch64-linux-android
          path: dist/*

  android-app:
    name: Android app
    needs: version
    runs-on: ubuntu-latest
    env:
      # A step's `if` cannot read a secret: whether the key exists is decided here.
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Release key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PO_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        shell: pwsh
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          PO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $env:PO_VERSION = "$env:GITHUB_REF_NAME".TrimStart('v')
          ./scripts/build-android.ps1 -Release
      - name: Package
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist/po-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-app
          path: dist/*

  release:
    name: Draft the release
    needs: [desktop, android-cli, android-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
