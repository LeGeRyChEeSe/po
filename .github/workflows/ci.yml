name: CI

# Ce fichier existe pour une raison précise : la validation terminale de Po a été menée sur
# Windows, WSL, tmux, SSH réel et Android (émulateur + Termux), mais **pas sur macOS**, faute
# de machine Apple. Les runners macOS de GitHub Actions comblent exactement ce trou, sans rien
# demander à personne d'autre qu'un `git push`.
#
# Les trois systèmes exécutent la même chose : la suite de tests, puis le banc de portabilité
# terminale dans un vrai pseudo-terminal.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # La sonde interroge le terminal ; sur un runner, personne ne répond et l'attente est
  # du temps perdu à chaque appel.
  PO_NO_PROBE: "1"

jobs:
  tests:
    name: Tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Suite de tests
        run: cargo test --workspace --all-targets
      - name: Avertissements traités comme des erreurs
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

  portabilite-terminale:
    name: Banc terminal — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS est la raison d'être de ce job : c'est la seule plateforme du cahier des
        # charges qui n'a pas pu être validée par exécution ailleurs.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compilation du binaire et du rendu plein écran
        run: |
          cargo build -p po
          cargo build -p po-tui --example smoke

      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux || true

      - name: Diagnostic du terminal du runner
        run: ./target/debug/po doctor

      - name: Banc de portabilité terminale
        run: |
          chmod +x scripts/terminal-matrix.sh
          PO_TUI_SMOKE=./target/debug/examples/smoke \
            bash scripts/terminal-matrix.sh ./target/debug/po

      - name: Validation SSH réelle
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/ssh-check.sh
          bash scripts/ssh-check.sh ./target/debug/po ./target/debug/examples/smoke

  android:
    name: Compilation Android (Bionic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # Deux pièges vérifiés en conditions réelles sur un appareil Android :
      # un binaire musl est refusé par le filtre seccomp d'Android, et le linker exige
      # les deux tables de hachage. Cette étape verrouille la recette qui fonctionne.
      - name: Compilation pour Bionic
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$BIN:$PATH"
          export CC_aarch64_linux_android=aarch64-linux-android24-clang
          export AR_aarch64_linux_android=llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-Wl,--hash-style=both"
          cargo build --release -p po --target aarch64-linux-android

      - name: Vérifier que les deux tables de hachage sont présentes
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT=$("$BIN/llvm-readelf" -d target/aarch64-linux-android/release/po)
          echo "$OUT" | grep -q "GNU_HASH" || { echo "DT_GNU_HASH absent"; exit 1; }
          echo "$OUT" | grep -qE "\(HASH\)"  || { echo "DT_HASH absent — Android refusera le binaire"; exit 1; }
          echo "les deux tables de hachage sont présentes"
