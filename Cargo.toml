[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeGeRyChEeSe/po"

[workspace.dependencies]
po-core = { path = "crates/po-core" }
po-provider = { path = "crates/po-provider" }
po-tools = { path = "crates/po-tools" }
po-local = { path = "crates/po-local" }
po-router = { path = "crates/po-router" }
po-term = { path = "crates/po-term" }
po-tui = { path = "crates/po-tui" }
po-mcp = { path = "crates/po-mcp" }
po-agent = { path = "crates/po-agent" }
po-i18n = { path = "crates/po-i18n" }
po-wire = { path = "crates/po-wire" }
po-link = { path = "crates/po-link" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ignore = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
unicode-segmentation = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
# Web pages for the model: reader mode (readability) and HTML to Markdown.
dom_smoothie = "0.19.0"
dom_query = { version = "0.29.0", features = ["markdown"] }
encoding_rs = "0.8"
url = "2"
dirs = "6"
toml = "0.9"
regex = "1"
tempfile = "3"
# Images shown in the transcript (thumbnails): decoding only, the common formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Git in Rust, for the Po Labs workspace: no `git` program, no user hooks.
gix = { version = "0.90", default-features = false, features = ["sha1", "dirwalk", "merge"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
